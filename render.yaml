services:
  # 1. FastAPI Backend Web Service (connected to Supabase PostgreSQL)
  - type: web
    name: sri-vasavi-textiles-api
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: "postgresql+psycopg://postgres.hhhntxbmhivushorsmaa:Srikala%4014321@aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require"
      - key: APP_NAME
        value: "Sri Vasavi Textiles ERP"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        value: "svt-prod-jwt-secret-key-srivasavitextiles-2026-secure"
      - key: CORS_ORIGINS
        value: "*"
